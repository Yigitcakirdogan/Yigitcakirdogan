<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtle Oscilloscope Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1000" y2="60" stroke-dasharray="4 4" />
    <line x1="0" y1="120" x2="1000" y2="120" stroke-dasharray="4 4" />
    <line x1="0" y1="180" x2="1000" y2="180" stroke-dasharray="4 4" />
    <line x1="250" y1="0" x2="250" y2="240" stroke-dasharray="4 4" />
    <line x1="500" y1="0" x2="500" y2="240" stroke-dasharray="4 4" />
    <line x1="750" y1="0" x2="750" y2="240" stroke-dasharray="4 4" />
  </g>

  <!-- Digital CAN / SPI Logic Analyzer Waveform -->
  <polyline fill="none" stroke="#10b981" stroke-width="2" opacity="0.35"
    points="30,210 90,210 90,190 130,190 130,210 170,210 170,190 230,190 230,210 270,210 270,190 310,190 310,210 390,210 390,190 450,190 450,210 520,210 520,190 580,190 580,210 640,210 640,190 710,190 710,210 780,210 780,190 860,190 860,210 970,210" />

  <!-- Header Texts -->
  <text x="48" y="68" fill="#38bdf8" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="bold" letter-spacing="2">
    EMBEDDED SYSTEMS • FUNCTIONAL SAFETY • AUTOMOTIVE FIRMWARE
  </text>

  <text x="48" y="114" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="800">
    Yiğit Çakırdoğan
  </text>

  <text x="48" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16">
    AUTOSAR Classic (MCAL/BSW/RTE/ASW) • ISO 26262 (ASIL-D) • MISRA C:2012 • STM32 (Cortex-M4F) • FreeRTOS
  </text>

  <!-- Right Side Architecture Pills -->
  <g font-family="Consolas, Monaco, monospace" font-size="12" font-weight="bold">
    <rect x="720" y="42" width="235" height="34" rx="6" fill="#1e1b4b" stroke="#6366f1" />
    <text x="738" y="64" fill="#a5b4fc">ISO 26262 ASIL-D (DC &gt; 99%)</text>

    <rect x="720" y="88" width="235" height="34" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="738" y="110" fill="#6ee7b7">MISRA C:2012 Zero-Malloc</text>

    <rect x="720" y="134" width="235" height="34" rx="6" fill="#0c4a6e" stroke="#38bdf8" />
    <text x="738" y="156" fill="#7dd3fc">AUTOSAR E2E + Circular DMA</text>
  </g>
</svg>
